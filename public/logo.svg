  <path d="M42 53 L63 72 L42 91" stroke="#dce8e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M68 53 L89 72 L68 91" stroke="#2bd97c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- RushSec wordmark with "Sec" in green -->
  <text x="130" y="74" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="46" font-weight="600" fill="#dce8e1" letter-spacing="-0.5">Rush<tspan fill="#2bd97c">Sec</tspan></text>
  <!-- Small red square before the tagline -->
  <rect x="132" y="93" width="7" height="7" rx="1" fill="#ff4d5e"/>
  <!-- Tagline -->
  <text x="148" y="100" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#7f948a" letter-spacing="1.5">SECURITY RESEARCH &amp; TOOLS</text>
